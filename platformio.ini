[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; The monitor's default filter replaces control characters with Unicode
; pictures, so ANSI colour arrives as literal ESC[32m instead of colour.
; Raw mode passes the escape sequences through untouched.
; If your terminal cannot render ANSI at all, set SERIAL_COLOR 0 in
; include/serial_ui.h instead.
monitor_raw = yes

; Default partitions give app0 only 1.31 MB and we were at 87.7% of it.
; huge_app.csv raises app0 to 3 MB. NOTE: changing the partition table
; requires a full erase (pio run -t erase) before the next upload.
board_build.partitions = huge_app.csv

lib_deps = 
    tzapu/WiFiManager
    bblanchon/ArduinoJson
    adafruit/Adafruit ADS1X15@^2.0.0
    adafruit/RTClib@^2.1.3
    adafruit/Adafruit INA219@^1.2.0
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit BME280 Library
